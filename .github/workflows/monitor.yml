name: Dune 3 Kinepolis Cloud Monitor

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test Discord ping? (true or false)'
        required: false
        default: 'false'

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Camoufox Browser Binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-v1

      - name: Install Camoufox Stealth Browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -U camoufox[geoip] requests
          python -m camoufox fetch

      - name: Run Kinepolis Cloud Tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cloud_bot.py
