name: Dune 3 Kinepolis Cloud Monitor

on:
  schedule:
    - cron: '*/15 6-20 * * *'
  
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test Discord ping? (true or false)'
        required: true
        default: 'true'

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Camoufox Stealth Browser
        run: |
          pip install -U camoufox[geoip] requests
          python -m camoufox fetch

      - name: Run Kinepolis Cloud Tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python cloud_bot.py
